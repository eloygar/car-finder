services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: car_finder
      POSTGRES_USER: car_finder
      POSTGRES_PASSWORD: car_finder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_finder -d car_finder"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - car_finder_postgres:/var/lib/postgresql/data

volumes:
  car_finder_postgres:
